<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light">
<title>Kitchen Sink</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%233aa7ff' stroke='%231b2545' stroke-width='3'/%3E%3Ccircle cx='11' cy='11' r='4' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{--ink:#1b2545;--sun:#ffd23f;--tom:#ff5a4f;--mint:#2ec4b6;--cream:#fff8e7;--sky:#3aa7ff;
--f:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#ffeec2;color:var(--ink);font-family:var(--f);
user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
button,input{font-family:var(--f);color:var(--ink)}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
#cv{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#hud{position:fixed;top:0;left:0;right:0;padding:calc(8px + env(safe-area-inset-top,0px)) calc(10px + env(safe-area-inset-right,0px)) 0 calc(10px + env(safe-area-inset-left,0px));
display:flex;flex-direction:column;gap:7px;pointer-events:none;transition:opacity .25s}
#bar{display:flex;align-items:center;gap:8px}
#title{pointer-events:auto;font-weight:900;font-size:19px;line-height:1;letter-spacing:.01em;color:var(--cream);background:var(--tom);
border:3px solid var(--ink);border-radius:14px;padding:9px 12px;box-shadow:0 4px 0 var(--ink);transform:rotate(-2deg)}
#timer{margin-left:auto;font-weight:900;font-size:18px;line-height:1;font-variant-numeric:tabular-nums;background:var(--cream);
border:3px solid var(--ink);border-radius:12px;padding:9px 10px;box-shadow:0 4px 0 var(--ink);min-width:86px;text-align:center}
#mute{pointer-events:auto;width:44px;height:44px;padding:0;display:grid;place-items:center;background:var(--sun);border:3px solid var(--ink);
border-radius:12px;box-shadow:0 4px 0 var(--ink)}
#mute svg{width:24px;height:24px}
#mute[aria-pressed=true] .on,#mute[aria-pressed=false] .off{display:none}
#pills{display:flex;gap:6px;height:27px;overflow:hidden}
.pill{position:relative;overflow:hidden;font-weight:800;font-size:12px;line-height:1;white-space:nowrap;background:var(--cream);
border:2.5px solid var(--ink);border-radius:99px;padding:5px 9px}
.pill i{position:absolute;left:0;top:0;bottom:0;width:100%;background:var(--sun);transform-origin:0 50%;transform:scaleX(0)}
.pill span{position:relative}
.pill.done i{background:var(--mint)}
#shelf{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:8px;pointer-events:none;transition:opacity .25s;
padding:8px calc(8px + env(safe-area-inset-right,0px)) calc(9px + env(safe-area-inset-bottom,0px)) calc(8px + env(safe-area-inset-left,0px))}
.tile{pointer-events:auto;flex:0 1 92px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 3px 6px;
background:var(--cream);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);font-weight:800;font-size:11px;line-height:1.15;
transition:transform .12s}
.tile canvas{width:50px;height:50px;display:block}
.tile small{font-weight:700;font-size:10px;opacity:.8;font-variant-numeric:tabular-nums}
.tile.sel{background:var(--sun);transform:translateY(-5px)}
.tile.lock{background:#e3dccb}
.tile.lock canvas{opacity:.35}
#banner{position:fixed;left:0;right:0;margin:0 auto;width:max-content;max-width:min(94vw,560px);transform:rotate(-1deg);display:flex;align-items:center;gap:10px;
background:var(--cream);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:9px 10px 9px 14px;font-weight:800;font-size:15px;line-height:1.2}
#banner[hidden],#codebox[hidden],#tests[hidden]{display:none}
#again{flex:none;font-weight:900;font-size:14px;background:var(--mint);border:3px solid var(--ink);border-radius:12px;padding:8px 11px;box-shadow:0 3px 0 var(--ink)}
#toast{position:fixed;left:50%;top:calc(104px + env(safe-area-inset-top,0px));transform:translate(-50%,-14px);opacity:0;pointer-events:none;
background:var(--ink);color:var(--cream);font-weight:900;font-size:15px;border-radius:14px;padding:10px 14px;transition:opacity .18s,transform .18s;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
#codebox{position:fixed;left:50%;top:calc(62px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;gap:6px;
background:var(--cream);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);padding:8px}
#code{width:170px;font-weight:800;font-size:16px;text-transform:uppercase;border:2.5px solid var(--ink);border-radius:10px;padding:7px 9px;background:#fff;
user-select:text;-webkit-user-select:text}
#codebox button{font-weight:900;font-size:15px;background:var(--sun);border:2.5px solid var(--ink);border-radius:10px;padding:7px 12px}
#help{position:fixed;left:calc(10px + env(safe-area-inset-left,0px));top:calc(96px + env(safe-area-inset-top,0px));pointer-events:none;transition:opacity .25s}
#helpbtn{pointer-events:auto;font-weight:900;font-size:13px;line-height:1;background:var(--cream);border:2.5px solid var(--ink);border-radius:11px;padding:7px 10px;box-shadow:0 3px 0 var(--ink)}
#helpbtn[aria-expanded=true]{background:var(--sun)}
#helpbox{margin-top:8px;width:206px;background:var(--cream);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);padding:8px 10px 9px}
#helpbox[hidden]{display:none}
#helpbox table{width:100%;border-collapse:collapse;font-size:12px;line-height:1.25}
#helpbox th,#helpbox td{text-align:left;vertical-align:top;padding:4px 0;border-top:1.5px solid rgba(27,37,69,.14)}
#helpbox tr:first-child th,#helpbox tr:first-child td{border-top:0}
#helpbox th{font-weight:900;padding-right:10px;white-space:nowrap}
#helpbox td{font-weight:700}
#helpbox .sec th{font-size:13px;padding-top:9px;border-top:2.5px solid var(--ink)}
#helpbox .code td{font-weight:900;letter-spacing:.04em}
#helpbox .code td+td{text-align:right;letter-spacing:0;color:#0b7a55}
#helpbox .note td{font-size:11px;opacity:.8}
body.intro #help{opacity:0}
body.intro #helpbtn{pointer-events:none}
#tests{position:fixed;left:8px;right:8px;top:8px;max-width:520px;max-height:80vh;overflow:auto;margin:0 auto;background:var(--cream);border:3px solid var(--ink);
border-radius:16px;box-shadow:0 5px 0 var(--ink);padding:12px 14px;font-size:13px;line-height:1.45;font-weight:700;z-index:9}
#tests h2{margin:0 0 6px;font-size:16px}
#tests .ok{color:#0b7a55}#tests .bad{color:#c4261d}
body.intro #hud,body.intro #shelf,body.intro #banner{opacity:0;pointer-events:none}
body.intro .tile,body.intro #title,body.intro #mute{pointer-events:none}
@media (max-height:480px){.tile canvas{width:34px;height:34px}.tile small{display:none}#title{font-size:16px;padding:7px 10px}#mute{width:38px;height:38px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <div id="bar">
    <button id="title" type="button">Kitchen Sink</button>
    <div id="timer" aria-label="Timer">0:00.0</div>
    <button id="mute" type="button" aria-label="Mute sound" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1b2545" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="#1b2545"/><path class="on" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.6 7.6 0 0 1 0 11"/><path class="off" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
    </button>
  </div>
  <div id="pills"></div>
</div>
<div id="help">
  <button id="helpbtn" type="button" aria-expanded="false" aria-controls="helpbox">Controls</button>
  <div id="helpbox" hidden>
    <table>
      <tr><th scope="row">Spray</th><td>Drag on the object</td></tr>
      <tr><th scope="row">Scrub a spot</th><td>Press and hold</td></tr>
      <tr><th scope="row">Switch object</th><td>Tap a tile</td></tr>
      <tr><th scope="row">Mute</th><td>Speaker button</td></tr>
      <tr><th scope="row">Skip intro</th><td>Any tap or key</td></tr>
      <tr class="sec"><th scope="col" colspan="2">Cheat codes</th></tr>
      <tr class="code"><td>JETCANNON</td><td id="c-JETCANNON"></td></tr>
      <tr class="code"><td>RAINBOW</td><td id="c-RAINBOW"></td></tr>
      <tr class="code"><td>SLOWMO</td><td id="c-SLOWMO"></td></tr>
      <tr class="code"><td>WIDELOAD</td><td id="c-WIDELOAD"></td></tr>
      <tr class="code"><td>SMASHING</td><td id="c-SMASHING"></td></tr>
      <tr class="note"><td colspan="2">Type a code, or tap the title 5 times. Enter it again to turn it off.</td></tr>
    </table>
  </div>
</div>
<div id="banner" hidden><span id="bmsg"></span><button id="again" type="button">Wash again</button></div>
<div id="shelf"></div>
<div id="toast" role="status" aria-live="polite"></div>
<form id="codebox" hidden autocomplete="off"><input id="code" type="text" maxlength="12" autocapitalize="characters" autocorrect="off" spellcheck="false" aria-label="Secret code" placeholder="Secret code"><button type="submit">OK</button></form>
<div id="tests" hidden></div>
<script>
(function(){
'use strict';
// ===================== CONFIG =====================
const N=64,GS=320,K=GS/100,CELL=100/N,TAU=Math.PI*2;
const R_BASE=7,PASS=0.8,HOLD=4,TH=24,GTH=80,GA=0.3,CS=4,CN=N/CS,MAXP=300,SHN=128;
const INK='#1b2545';
const QS=new URLSearchParams(location.search),TEST=QS.get('test')==='1';
const $=id=>document.getElementById(id);
let RM=false;
try{const mq=matchMedia('(prefers-reduced-motion: reduce)');RM=mq.matches;const f=e=>{RM=e.matches};mq.addEventListener?mq.addEventListener('change',f):mq.addListener(f)}catch(e){}

// ===================== STORAGE =====================
function makeStore(back,key){
  const mem={intro:false,mute:false,reg:{},done:{},best:{}};let ok=true;
  try{const o=JSON.parse(back.getItem(key));if(o&&typeof o==='object')for(const k in mem)if(o[k]!=null&&typeof o[k]===typeof mem[k])mem[k]=o[k]}catch(e){ok=false}
  return{data:mem,save:function(){try{back.setItem(key,JSON.stringify(mem));ok=true}catch(e){ok=false}},ok:function(){return ok}};
}
let LS=null;try{LS=window.localStorage}catch(e){}
const store=makeStore(LS,'kitchen-sink-v1'),st=store.data;

// ===================== MODEL (pure logic, typed arrays, no DOM) =====================
function newModel(map,nReg){
  const n=N*N,c=CN*CN,ch=new Int16Array(n);ch.fill(-1);
  return{map,nReg,d:[new Uint8Array(n),new Uint8Array(n),new Uint8Array(n)],
    init:new Int32Array(nReg+1),cur:new Int32Array(nReg+1),dirty:new Int32Array(nReg+1),done:new Uint8Array(nReg+1),
    chunk:ch,hp:new Float32Array(c),hit:new Int32Array(c),alive:new Uint8Array(c),sid:0,
    evC:new Int16Array(c),nC:0,evR:new Uint8Array(8),nR:0};
}
function mDirty(m,i){return m.d[0][i]>TH||m.d[1][i]>TH||m.d[2][i]>TH}
function mSet(m,L,i,v){
  const a=m.d[L],old=a[i];if(old===v)return 0;
  const r=m.map[i],was=mDirty(m,i);a[i]=v;m.cur[r]+=v-old;
  const now=mDirty(m,i);if(was!==now)m.dirty[r]+=now?1:-1;
  return old-v;
}
function mFreeze(m){for(let r=0;r<=m.nReg;r++){m.init[r]=m.cur[r];m.done[r]=r>0&&!m.cur[r]?1:0}}
function mPct(m,r){return m.done[r]?1:m.init[r]?1-m.cur[r]/m.init[r]:1}
function mGlow(m,r){return!m.done[r]&&mPct(m,r)>=0.98}
function mAllDone(m){for(let r=1;r<=m.nReg;r++)if(!m.done[r])return false;return true}
function mCrust(m,c,hp){
  const bx=(c%CN)*CS,by=((c/CN)|0)*CS;let k=0;
  for(let y=by;y<by+CS;y++)for(let x=bx;x<bx+CS;x++){const i=y*N+x;if(m.map[i]){mSet(m,2,i,255);m.chunk[i]=c;k++}}
  if(k){m.hp[c]=hp;m.alive[c]=1}
  return k;
}
function mBreak(m,c){
  const bx=(c%CN)*CS,by=((c/CN)|0)*CS;let rem=0;
  for(let y=by;y<by+CS;y++)for(let x=bx;x<bx+CS;x++){const i=y*N+x;if(m.chunk[i]===c){rem+=mSet(m,2,i,0);m.chunk[i]=-1}}
  m.alive[c]=0;m.hp[c]=0;m.evC[m.nC++]=c;
  return rem;
}
function mComplete(m,r){
  if(m.done[r])return false;
  const d0=m.d[0],d1=m.d[1],d2=m.d[2],map=m.map;
  for(let i=0;i<N*N;i++)if(map[i]===r){d0[i]=0;d1[i]=0;d2[i]=0}
  m.done[r]=1;m.cur[r]=0;m.dirty[r]=0;
  return true;
}
// one stamp on the grid. gx,gy,gr in cells. Returns dirt removed. Fills m.evC / m.evR.
function mStamp(m,gx,gy,gr,pw,wide){
  m.nC=0;m.nR=0;m.sid++;
  const x0=wide?0:Math.max(0,Math.floor(gx-gr)),x1=wide?N-1:Math.min(N-1,Math.ceil(gx+gr));
  const y0=Math.max(0,Math.floor(gy-gr)),y1=Math.min(N-1,Math.ceil(gy+gr));
  const r2=gr*gr,ga=Math.min(1,GA*pw),d0=m.d[0],d1=m.d[1],d2=m.d[2],map=m.map;
  let rem=0,touched=0;
  for(let y=y0;y<=y1;y++){
    const dy=y+.5-gy;
    for(let x=x0;x<=x1;x++){
      const dx=wide?0:x+.5-gx,q=dx*dx+dy*dy;
      if(q>r2)continue;
      const i=y*N+x,r=map[i];
      if(!r||m.done[r])continue;
      touched|=1<<r;
      if(d0[i])rem+=mSet(m,0,i,0);
      const g=d1[i];
      if(g){
        const f=q<r2*.36?1:1-.65*(Math.sqrt(q)-.6*gr)/(.4*gr);
        let v=g*(1-ga*f)|0;if(v<GTH)v=0;
        rem+=mSet(m,1,i,v);
      }
      if(d2[i]){
        const c=m.chunk[i];
        if(c>=0&&m.hit[c]!==m.sid){m.hit[c]=m.sid;m.hp[c]-=pw;if(m.hp[c]<=1e-6)rem+=mBreak(m,c)}
      }
    }
  }
  if(touched)for(let r=1;r<=m.nReg;r++)if(touched&(1<<r)&&!m.done[r]&&m.dirty[r]===0&&mComplete(m,r))m.evR[m.nR++]=r;
  return rem;
}
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mkNoise(rnd,n){
  const w=n+1,g=new Float32Array(w*w);for(let i=0;i<g.length;i++)g[i]=rnd();
  return function(u,v){
    const x=u*n,y=v*n,x0=Math.min(n-1,x|0),y0=Math.min(n-1,y|0),fx=x-x0,fy=y-y0,sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy);
    const a=g[y0*w+x0],b=g[y0*w+x0+1],c=g[(y0+1)*w+x0],d=g[(y0+1)*w+x0+1];
    return a+(b-a)*sx+(c-a)*sy+(a-b-c+d)*sx*sy;
  };
}

// ===================== AUDIO =====================
let AC=null,aMaster=null,aSpray=null,aSprayF=null,aNoise=null,lastCrack=0,lastBuzz=0,nChime=0,nCrack=0;
function audioUnlock(){
  const ua=navigator.userActivation;if(ua&&!ua.isActive)return;
  if(!AC){
    const A=window.AudioContext||window.webkitAudioContext;if(!A)return;
    try{AC=new A()}catch(e){AC=null;return}
    aMaster=AC.createGain();aMaster.gain.value=st.mute?0:1;aMaster.connect(AC.destination);
    const n=AC.sampleRate*2|0;aNoise=AC.createBuffer(1,n,AC.sampleRate);
    const d=aNoise.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    const src=AC.createBufferSource();src.buffer=aNoise;src.loop=true;
    aSprayF=AC.createBiquadFilter();aSprayF.type='bandpass';aSprayF.frequency.value=2600;aSprayF.Q.value=.7;
    aSpray=AC.createGain();aSpray.gain.value=0;
    src.connect(aSprayF);aSprayF.connect(aSpray);aSpray.connect(aMaster);src.start();
  }
  if(AC.state==='suspended'){try{const p=AC.resume();if(p&&p.catch)p.catch(function(){})}catch(e){}}
}
function audioPause(h){if(!AC)return;try{const p=h?AC.suspend():AC.resume();if(p&&p.catch)p.catch(function(){})}catch(e){}}
function sprayOn(){ // looped noise through a bandpass, 30 ms attack
  if(!AC)return;const t=AC.currentTime,g=aSpray.gain;
  g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);g.linearRampToValueAtTime(CH.JETCANNON?.6:.32,t+.03);
  aSprayF.frequency.setTargetAtTime(CH.JETCANNON?850:2600,t,.04);
}
function sprayOff(){if(!AC)return;const t=AC.currentTime,g=aSpray.gain;g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);g.linearRampToValueAtTime(0,t+.09)}
function tone(f,t0,dur,type,vol){
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.012);g.gain.exponentialRampToValueAtTime(.0008,t0+dur);
  o.connect(g);g.connect(aMaster);o.start(t0);o.stop(t0+dur+.03);return o;
}
function burst(t0,dur,type,f,q,vol){
  const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=aNoise;fl.type=type;fl.frequency.setValueAtTime(f,t0);fl.Q.value=q;
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0008,t0+dur);
  s.connect(fl);fl.connect(g);g.connect(aMaster);s.start(t0,Math.random()*1.4,dur+.05);return fl;
}
const SCALE=[523.25,659.25,783.99,1046.5,1318.51,1567.98];
function sfxChime(n){ // rising arpeggio; n===9 is the long one for a whole object
  nChime++;if(!AC)return;
  const t=AC.currentTime+.01,big=n===9,k=big?6:3,b=big?0:(n-1)%3;
  for(let i=0;i<k;i++)tone(SCALE[b+i],t+i*.075,big?.8:.42,'triangle',.2);
  if(big)tone(2093,t+.48,1,'sine',.1);
}
function sfxCrack(){
  nCrack++;if(!AC)return;const t=AC.currentTime;if(t-lastCrack<.035)return;lastCrack=t;
  burst(t,.07,'highpass',1800+Math.random()*1600,1,.4);tone(130+Math.random()*70,t,.06,'square',.1);
}
function sfxRip(){
  if(!AC)return;const t=AC.currentTime+.01,o=tone(90,t,.42,'sawtooth',.22);
  o.frequency.exponentialRampToValueAtTime(950,t+.3);
  burst(t+.26,.7,'bandpass',1100,.6,.7).frequency.exponentialRampToValueAtTime(3200,t+.8);tone(1900,t+.28,.5,'square',.05);
}
function sfxSmash(){
  if(!AC)return;const t=AC.currentTime+.01;burst(t,.5,'highpass',2400,.5,.7);
  for(let i=0;i<6;i++)tone(1700+Math.random()*3600,t+Math.random()*.08,.22+Math.random()*.35,'sine',.07);
}
function setMute(m){
  st.mute=!!m;store.save();if(aMaster)aMaster.gain.value=m?0:1;
  $('mute').setAttribute('aria-pressed',m?'true':'false');
}
$('mute').addEventListener('click',function(){audioUnlock();setMute(!st.mute);toast(st.mute?'Sound off':'Sound on')});
setMute(st.mute);
// haptics: feature-detected (not available in iOS Safari)
const canBuzz=typeof navigator.vibrate==='function';
function buzz(){if(!canBuzz)return;const t=performance.now();if(t-lastBuzz<70)return;lastBuzz=t;try{navigator.vibrate(15)}catch(e){}}
function buzzOff(){if(canBuzz)try{navigator.vibrate(0)}catch(e){}}


// ===================== INPUT =====================
const cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
const P={down:false,id:-1,cx:0,cy:0,sx:0,sy:0,ux:50,uy:50,lx:50,ly:50,dx:0,dy:-1,stamped:false,smeared:false,rem:0};
const CH={JETCANNON:false,RAINBOW:false,SLOWMO:false,WIDELOAD:false,SMASHING:false};

function sprayR(){return CH.JETCANNON?R_BASE*4:R_BASE}
function sprayPow(){return CH.JETCANNON?8:1}
function toUnit(cx,cy){
  const o=cur,x=cx*DPR-(CX+o.ox),y=cy*DPR-(CY+o.oy),c=Math.cos(o.rot),s=-Math.sin(o.rot);
  P.ux=(x*c-y*s)/KS+50;P.uy=(x*s+y*c)/KS+50;P.sx=cx*DPR;P.sy=cy*DPR;P.cx=cx;P.cy=cy;
}
function seg(cx,cy){
  toUnit(cx,cy);
  const dx=P.ux-P.lx,dy=P.uy-P.ly,d=Math.sqrt(dx*dx+dy*dy);
  if(d<.05)return;
  const r=sprayR(),n=Math.min(60,Math.ceil(d/(r/3))),pw=PASS*(d/n)/r*sprayPow();
  P.dx=dx/d;P.dy=dy/d;
  smear(cur,P.lx,P.ly,P.dx,P.dy,r);
  let rem=0;
  for(let k=1;k<=n;k++)rem+=stamp(P.lx+dx*k/n,P.ly+dy*k/n,r,pw);
  P.lx=P.ux;P.ly=P.uy;P.stamped=true;P.rem+=rem;
  if(rem>0)buzz();
}
function release(e){
  if(!P.down||(e&&e.pointerId!==P.id))return;
  P.down=false;P.id=-1;sprayOff();buzzOff();
}
cv.addEventListener('pointerdown',function(e){
  if(e.pointerType==='mouse'&&e.button!==0)return;
  e.preventDefault();
  audioUnlock();
  if(introSkip())return;
  if(P.down||!cur)return;
  P.down=true;P.id=e.pointerId;
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  toUnit(e.clientX,e.clientY);P.lx=P.ux;P.ly=P.uy;
  runStart();
  const rem=stamp(P.ux,P.uy,sprayR(),.35*sprayPow());   // instant: stamp + sound in the handler itself
  sprayOn();
  P.stamped=true;P.rem+=rem;if(rem>0)buzz();
});
cv.addEventListener('pointermove',function(e){
  if(!P.down||e.pointerId!==P.id)return;
  const l=e.getCoalescedEvents?e.getCoalescedEvents():null;
  if(l&&l.length>1){for(let i=0;i<l.length;i++)seg(l[i].clientX,l[i].clientY)}
  else seg(e.clientX,e.clientY);
});
cv.addEventListener('pointerup',function(e){audioUnlock();release(e)});   // touch only counts as a gesture on release

// ===================== TESTS =====================
function runTests(){
  const res=[];
  function T(name,fn){let ok=false,info='';try{const r=fn();ok=r===true;if(!ok)info=String(r)}catch(e){info='threw '+e.message}res.push({name,ok,info})}
  function mk(f){const map=new Uint8Array(N*N);for(let i=0;i<N*N;i++)map[i]=f(i%N,i/N|0);return map}
  function coat(m,L){for(let i=0;i<N*N;i++)if(m.map[i])mSet(m,L,i,255)}
  const halves=function(x){return x<32?1:2};
  T('A stamp reduces dirt',function(){const m=newModel(mk(halves),2);coat(m,0);mFreeze(m);const b=m.cur[1],rem=mStamp(m,16,32,5,1,false);return rem>0&&m.cur[1]===b-rem&&m.cur[2]===m.init[2]||'rem='+rem});
  T('Percent-clean is 0 when untouched',function(){const m=newModel(mk(halves),2);coat(m,0);mFreeze(m);return mPct(m,1)===0&&mPct(m,2)===0||mPct(m,1)});
  T('Percent-clean is 50 with half the cells cleared',function(){const m=newModel(mk(halves),2);coat(m,0);mFreeze(m);for(let y=0;y<32;y++)for(let x=0;x<32;x++)mSet(m,0,y*N+x,0);return Math.abs(mPct(m,1)-.5)<1e-9&&mPct(m,2)===0||mPct(m,1)});
  T('Percent-clean is 100 when all cells are cleared',function(){const m=newModel(mk(halves),2);coat(m,0);coat(m,1);mFreeze(m);for(let i=0;i<N*N;i++)if(m.map[i]===1){mSet(m,0,i,0);mSet(m,1,i,0)}return mPct(m,1)===1&&m.dirty[1]===0||mPct(m,1)});
  T('Splatter clears in one pass',function(){const m=newModel(mk(halves),2);coat(m,0);mFreeze(m);mStamp(m,16,32,4,1,false);return m.d[0][32*N+16]===0&&m.d[0][32*N+17]===0||m.d[0][32*N+16]});
  T('Grease needs more than one pass',function(){const m=newModel(mk(halves),2);coat(m,1);mFreeze(m);const i=32*N+16;mStamp(m,16.5,32.5,4,1,false);const a=m.d[1][i];let n=1;while(m.d[1][i]>0&&n<50){mStamp(m,16.5,32.5,4,1,false);n++}return a>TH&&a<255&&n>1&&n<10||'after1='+a+' passes='+n});
  T('Crust chunks respect HP',function(){const m=newModel(mk(halves),2);const c=8*CN+3;mCrust(m,c,3);mFreeze(m);const i=(8*CS+1)*N+3*CS+1;
    mStamp(m,3*CS+2,8*CS+2,2,1,false);mStamp(m,3*CS+2,8*CS+2,2,1,false);const mid=m.alive[c]===1&&m.d[2][i]===255&&m.nC===0;
    mStamp(m,3*CS+2,8*CS+2,2,1,false);return mid&&m.alive[c]===0&&m.d[2][i]===0&&m.nC===1&&m.evC[0]===c||'mid='+mid+' alive='+m.alive[c]});
  T('Region completion fires exactly once',function(){const m=newModel(mk(function(x,y){return x>=10&&x<16&&y>=10&&y<16?1:2}),2);coat(m,0);mFreeze(m);let n=0;
    for(let k=0;k<6;k++){mStamp(m,13,13,6,1,false);for(let j=0;j<m.nR;j++)if(m.evR[j]===1)n++}return n===1&&m.done[1]===1&&m.done[2]===0&&mPct(m,1)===1||'fired='+n});
  T('Glow assist turns on at 98% and off at 100%',function(){const m=newModel(mk(function(x,y){return x<10&&y<10?1:0}),1);coat(m,0);mFreeze(m);
    for(let k=0;k<97;k++)mSet(m,0,(k/10|0)*N+k%10,0);const a=mGlow(m,1);mSet(m,0,9*N+7,0);const b=mGlow(m,1);mSet(m,0,9*N+8,0);mSet(m,0,9*N+9,0);mComplete(m,1);const c=mGlow(m,1);
    return a===false&&b===true&&c===false||[a,b,c].join()});
  T('Storage falls back to memory when the backend throws',function(){const bad={getItem:function(){throw new Error('denied')},setItem:function(){throw new Error('denied')}};
    const s=makeStore(bad,'k');s.data.mute=true;s.save();s.data.best.pan=1234;s.save();return s.ok()===false&&s.data.mute===true&&s.data.best.pan===1234||'ok='+s.ok()});
  T('Storage works with no backend at all',function(){const s=makeStore(null,'k');s.data.intro=true;s.save();return s.data.intro===true&&s.ok()===false||'ok='+s.ok()});
  T('Storage round-trips when available',function(){const kv={},be={getItem:function(k){return k in kv?kv[k]:null},setItem:function(k,v){kv[k]=v}};
    const a=makeStore(be,'k');a.data.best.pan=4321;a.data.reg.pan=5;a.save();const b=makeStore(be,'k');return b.data.best.pan===4321&&b.data.reg.pan===5&&b.ok()||JSON.stringify(b.data)});
  T('Cheat parser matches on suffix and toggles on',function(){const s={RAINBOW:false};let b='',n=0;for(const ch of 'XYZRAINBOW'){b=cheatPush(b,ch);const c=cheatMatch(b);if(c){b='';n++;cheatToggle(s,c)}}return n===1&&s.RAINBOW===true||'n='+n});
  T('Entering a cheat again toggles it off',function(){const s={SLOWMO:false};let b='';const seen=[];for(const ch of 'SLOWMOSLOWMSLOWMO'){b=cheatPush(b,ch);const c=cheatMatch(b);if(c){b='';seen.push(cheatToggle(s,c))}}return seen.join()==='true,false'&&s.SLOWMO===false||seen.join()});
  T('Cheat buffer keeps a rolling 12 letters and ignores near misses',function(){let b='';for(const ch of 'ABCDEFGHIJKLMNOPJETCANNO')b=cheatPush(b,ch);const a=b.length===12&&cheatMatch(b)===null;b=cheatPush(b,'N');return a&&cheatMatch(b)==='JETCANNON'&&cheatMatch('WIDELOAD')==='WIDELOAD'&&cheatMatch('SMASHIN')===null||b});
  const bad=res.filter(function(r){return!r.ok}).length;
  window.__testResults={total:res.length,passed:res.length-bad,failed:bad,results:res};
  const el=$('tests');el.hidden=false;
  let h='<h2 class="'+(bad?'bad':'ok')+'">Self-checks: '+(res.length-bad)+' of '+res.length+' passed</h2>';
  for(const r of res)h+='<div class="'+(r.ok?'ok':'bad')+'">'+(r.ok?'PASS':'FAIL')+' &nbsp;'+r.name+(r.ok?'':' ('+r.info+')')+'</div>';
  el.innerHTML=h;el.onclick=function(){el.hidden=true};
}

window.__ks={pct:function(r){return mPct(cur.m,r)},done:function(r){return!!cur.m.done[r]},obj:function(){return cur.id},cheats:CH,parts:function(){return pn},
  rect:function(){return{x:(CX-S/2)/DPR,y:(CY-S/2)/DPR,s:S/DPR}},sel:function(i){selectObj(i)},st:st,o:function(){return cur},intro:function(){return{on:intro.on,t:intro.t}},audio:function(){return{state:AC?AC.state:'none',spray:aSpray?aSpray.gain.value:0,master:aMaster?aMaster.gain.value:-1,chimes:nChime,cracks:nCrack,canBuzz:canBuzz}}};
(function(){
  let i=0;while(i<3&&st.done[OBJ[i].id])i++;
  if(i===3&&!st.done.sink)i=3;else if(i===3)i=0;
  layout();selectObj(i);introStart();loopStart();
  setHelp((CX-S/2)/DPR>=236);   // open by default only where it fits beside the play area
})();
if(TEST)runTests();
})();
</script>
